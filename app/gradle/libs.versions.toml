[versions]
agp = "9.2.1"
# 升级须与 AGP 9 的内置 Kotlin 保持兼容（钉版原因见根 build.gradle.kts）
kotlin = "2.3.21"
# KSP 需与 Kotlin 编译器版本匹配，升级 kotlin 时同步核对 ksp 发行说明
ksp = "2.3.9"
# kotlinpoet-ksp 与 KSP API 存在版本对应关系，升级 ksp 时同步验证
kotlinpoet = "2.3.0"
snakeyamlEngine = "2.9"
floatingX = "2.3.7"
# 与公开 JIT 插件钉在同一发行版，避免厂商插件 ABI 混用。
litert = "2.1.0rc1"

# 首启解压 rootfs.tar.xz：纯 Java 流式解 tar/xz（busybox tar 解 ubuntu 硬链接必炸，不用）
commonsCompress = "1.27.1"
tukaaniXz = "1.10"

coreKtx = "1.19.0"
coreSplashscreen = "1.2.0"
activityCompose = "1.13.0"
appcompat = "1.7.1"
# alpha 渠道，升级时留意 API 变动
biometric = "1.2.0-alpha05"
lifecycle = "2.11.0"

composeBom = "2026.05.01"
material3 = "1.5.0-alpha28"
navigationEvent = "1.1.2"
collectionsImmutable = "0.5.1"
miuix = "0.9.4"
glance = "1.1.1"
lottie = "6.7.1"

koin = "4.2.1"

# AzurPilot WebSocket 网关与 Release 分段下载共用网络栈。
okhttp = "5.2.1"
streamWebrtc = "1.3.10"
nanohttpd = "2.3.1"

datastore = "1.2.1"
window = "1.5.1"
browser = "1.10.0"

timber = "5.0.1"

kotlinxSerializationJson = "1.11.0"

# 提权与 native 接入
shizuku = "13.1.5"
libsu = "6.0.0"
xxPermissions = "28.0"

junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
mockk = "1.14.11"
coroutinesTest = "1.10.2"

[libraries]
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
adb-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.86" }
adb-boringssl = { module = "io.github.vvb2060.ndk:boringssl", version = "20250114" }
hidden-api-bypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version = "6.1" }
material-kolor = { module = "com.materialkolor:material-kolor", version = "5.0.1" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version = "5.0.1" }
androidx-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "material3" }
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "navigationEvent" }
androidx-foundation = { module = "androidx.compose.foundation:foundation" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
miuix-squircle = { module = "top.yukonga.miuix.kmp:miuix-squircle-android", version.ref = "miuix" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-glance = { group = "androidx.glance", name = "glance", version.ref = "glance" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
stream-webrtc-android = { module = "io.getstream:stream-webrtc-android", version.ref = "streamWebrtc" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { group = "org.nanohttpd", name = "nanohttpd-websocket", version.ref = "nanohttpd" }
# 容器 DNS 的 DoH 主路由（#31）：RFC 8484 查询走 443，不受 UDP 53 拦截影响。
okhttp-dnsoverhttps = { group = "com.squareup.okhttp3", name = "okhttp-dnsoverhttps", version.ref = "okhttp" }

koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# build-logic 里引 AGP / KGP 的 DSL 类型用；插件实现本体由根 build.gradle.kts 的 apply false 带上 classpath
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
snakeyaml-engine = { group = "org.snakeyaml", name = "snakeyaml-engine", version.ref = "snakeyamlEngine" }

kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
libsu = { group = "com.github.topjohnwu.libsu", name = "core", version.ref = "libsu" }
xx-permissions = { group = "com.github.getActivity", name = "XXPermissions", version.ref = "xxPermissions" }
floatingx = { group = "io.github.petterpx", name = "floatingx", version.ref = "floatingX" }
# compose 支持拆在独立构件里（OverlayController 引 com.petterp.floatingx.compose.enableComposeSupport）；
# 中央仓 floatingx 本体不含 compose 包，jitpack 聚合 jar 为空壳，必须显式声明
floatingx-compose = { group = "io.github.petterpx", name = "floatingx-compose", version.ref = "floatingX" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
tukaani-xz = { group = "org.tukaani", name = "xz", version.ref = "tukaaniXz" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
