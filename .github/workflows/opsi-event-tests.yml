name: Android Operation Siren event transitions

on:
  pull_request:
    paths:
      - 'rootfs/overlays/**'
      - 'rootfs/tests/test_android_opsi_event.py'
      - 'rootfs/build/build-azurpilot.sh'
      - 'app/app/build.gradle.kts'
      - 'app/app/src/main/kotlin/com/azurpilot/ghio/proot/ProotHost.kt'
      - '.github/azurpilot-upstream.txt'
      - '.github/workflows/opsi-event-tests.yml'
  push:
    branches: [main, fix/android-opsi-event-transition]
    paths:
      - 'rootfs/**'
      - 'app/app/build.gradle.kts'
      - 'app/app/src/main/kotlin/com/azurpilot/ghio/proot/ProotHost.kt'
      - '.github/azurpilot-upstream.txt'
      - '.github/workflows/opsi-event-tests.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: core
        run: echo "ref=$(cat .github/azurpilot-upstream.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: wess09/AzurPilot
          ref: ${{ steps.core.outputs.ref }}
          path: upstream-core
          sparse-checkout: |
            module/os
            module/os_shop
      - name: Test pinned-core methods and runtime integration
        env:
          AZURPILOT_SOURCE: ${{ github.workspace }}/upstream-core
        run: python3 rootfs/tests/test_android_opsi_event.py -v
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile rootfs/overlays/android_opsi_event.py rootfs/overlays/sitecustomize.py
          bash -n rootfs/build/build-azurpilot.sh
          git diff --check
