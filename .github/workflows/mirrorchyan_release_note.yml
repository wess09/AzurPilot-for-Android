name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Rolling release tag; uses versionName from latest.json
        default: azurpilot-android-latest
        required: false
        type: string
  release:
    types: [edited]

permissions:
  contents: read
  issues: write

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'wess09' && (github.event_name != 'release' || github.event.release.tag_name == 'azurpilot-android-latest') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current release notes
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python3 tools/mirrorchyan_release.py --tag "$RELEASE_TAG"
      - uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: AzurPilotAndroid
          version_name: ${{ steps.release.outputs.version }}
          release_note: ${{ steps.release.outputs.release_note }}
          channel: stable
          owner: wess09
          repo: AzurPilot-for-Android
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
      - uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: AzurPilotAndroidUpdate
          version_name: ${{ steps.release.outputs.version }}
          release_note: ${{ steps.release.outputs.release_note }}
          channel: stable
          owner: wess09
          repo: AzurPilot-for-Android
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
